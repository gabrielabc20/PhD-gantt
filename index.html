01"}, {"id": "n9", "kind": "diseno", "title": "Utilidad clínica", "text": "¿Qué subgrupo de población merece vigilancia posterior?\nDatos: Riesgo absoluto, costes/umbrales, disponibilidad de genética/imagen.\nMétodos: Decision curve analysis, NNS/NNI, curvas de calibración.\nMétricas: Net benefit, PPV operativo, tamaño grupo alto riesgo.\nSalida: Regla de selección del grupo de riesgo.", "date": "2026-10-01"}, {"id": "n10", "kind": "diseno", "title": "Genética/molecular", "text": "¿Mejora la estratificación añadir información genética?\nDatos: PRS, variantes germinales, antecedentes familiares, biomarcadores si existen.\nMétodos: Modelos incrementales, NRI/IDI, ablation studies.\nMétricas: Mejora calibrada y estable sobre modelo clínico.\nSalida: Modelo ampliado.", "date": "2026-10-01"}, {"id": "n11", "kind": "diseno", "title": "Imagen/radiómica", "text": "¿Puede la imagen caracterizar mejor a los sujetos de alto riesgo?\nDatos: CT/MRI, segmentaciones, variables radiómicas, timing respecto a diagnóstico.\nMétodos: Radiomics, selección de features, modelos de segunda fase.\nMétricas: Rendimiento incremental y robustez.\nSalida: Modelo multimodal de segunda fase.", "date": "2026-10-01"}, {"id": "n12", "kind": "diseno", "title": "Reproducibilidad", "text": "¿Puede repetirse todo el pipeline?\nDatos: Código, versiones, diccionario, logs, semillas, documentación.\nMétodos: MLflow/DVC o equivalente; notebooks auditables.\nMétricas: Trazabilidad y reproducibilidad.\nSalida: Repositorio interno listo para auditoría.", "date": "2026-10-01"}, {"id": "n13", "kind": "nota", "title": "Título provisional y estrategia", "text": "Desarrollo de modelos de aprendizaje automático para la detección preclínica del riesgo de adenocarcinoma ductal pancreático esporádico antes del diagnóstico sintomático.\nEstrategia: estratificación de riesgo clínico-epidemiológico → integración genética/molecular → radiómica en población enriquecida.", "date": "2026-10-01"}, {"id": "n14", "kind": "nota", "title": "Ritmo de seguimiento", "text": "Reunión científica cada 2-4 semanas (avances, bloqueos, decisiones, próximos pasos). Cada 6 meses: revisión de hitos (Gantt, riesgos, outputs, publicaciones). Informe anual en los años 1, 2 y 3.", "date": "2026-10-01"}]};
const mk=()=>JSON.parse(JSON.stringify(SEED));
let S=mk(),db,tab='home',form=null,timer;
const W=()=>S.project.totalWeeks||36;
const today=()=>{const n=new Date();n.setHours(0,0,0,0);return n};
const mi=d=>{const s=pd(S.project.startDate);return(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth()+1};
const cw=()=>mi(today());
const du=s=>Math.round((pd(s)-today())/864e5);
const PH=id=>S.phases.find(p=>p.id===id)||{name:'Sin fase',color:'#5a5f78'};
const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)};
const sync=s=>{$('dot').className='dot '+s};

async function init(){
 if(FIREBASE_CONFIG.apiKey.includes('PEGA_AQUI')){$('load').innerHTML='⚠️ Falta pegar tu firebaseConfig al inicio del archivo HTML.';return}
 try{
  sync('syncing');db=getFirestore(initializeApp(FIREBASE_CONFIG));
  const ref=doc(db,'projects',PROJECT_ID);
  if(!(await getDoc(ref)).exists())await setDoc(ref,{...S,updatedAt:new Date().toISOString()});
  onSnapshot(ref,s=>{if(s.exists()){const d=s.data();S={project:d.project||S.project,phases:d.phases||[],tasks:d.tasks||[],milestones:d.milestones||[],notes:d.notes||[]};render();sync('synced')}},()=>sync('error'));
  $('load').style.display='none';$('app').style.display='flex';render();
 }catch(e){$('load').innerHTML='⚠️ Error de conexión<br><small>'+esc(e.message)+'</small>'}
}
function save(){clearTimeout(timer);timer=setTimeout(async()=>{try{sync('syncing');await setDoc(doc(db,'projects',PROJECT_ID),{...S,updatedAt:new Date().toISOString()});sync('synced')}catch{sync('error');toast('⚠ Error al guardar')}},500)}

const card=t=>{const c=cw(),p=PH(t.phase),cur=t.weekStart<=c&&t.weekEnd>=c,od=t.weekEnd<c&&!t.done;
 return `<div class="tc${t.done?' done':od?' od':cur?' cur':''}" onclick="tog('${t.id}')"><div class="ck">✓</div><div class="ti"><div class="tn">${esc(t.name)}</div><div class="tm"><span class="bd" style="background:${p.color}22;color:${p.color}">${esc(p.name)}</span><span class="bd">M${t.weekStart}${t.weekEnd>t.weekStart?'–M'+t.weekEnd:''}</span>${od?'<span class="bd" style="color:var(--dg)">⚠ Atrasada</span>':''}</div>${t.output?`<div class="to">→ ${esc(t.output)}</div>`:''}</div><div class="eb" onclick="event.stopPropagation();openF('task','${t.id}')">✎</div></div>`};
const mcard=m=>{const d=du(m.date);return `<div class="ms${d<0?' past':''}" onclick="openF('ms','${m.id}')"><div style="font-size:22px">${esc(m.icon||'◆')}</div><div><b>${esc(m.name)}</b><small>${fd(m.date)}${m.res?' · '+esc(m.res):''}</small></div><div class="d">${d<0?'Pasado':d===0?'¡Hoy!':d+'d'}</div></div>`};

function render(){
 const c=cw(),n=W(),T=S.tasks,dn=T.filter(x=>x.done).length,pct=T.length?Math.round(dn/T.length*100):0,dl=du(S.project.endDate);
 $('ttl').textContent=S.project.title||'Doctorado Gantt';
 $('today').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
 const wk=c<1?'Antes del inicio':c>n?'Plazo finalizado':`Mes ${c} de ${n}`;
 const c2=Math.max(1,c),wt=T.filter(t=>t.weekStart<=c2&&t.weekEnd>=c2);
 const ups=S.milestones.filter(m=>du(m.date)>=0).sort((a,b)=>du(a.date)-du(b.date));
 $('v-home').innerHTML=`<div class="ban"><div><strong>${wk}</strong><span>Entrega: ${fd(S.project.endDate)}</span></div><div class="big">${dl>0?dl+'d':dl===0?'¡Hoy!':'🎓'}</div></div>
 <div class="cards"><div class="cd"><small>Progreso</small><b>${pct}%</b><span style="font-size:10px;color:var(--m)">${dn} / ${T.length} tareas</span><div class="bar0"><i style="width:${pct}%"></i></div></div>
 <div class="cd"><small>Próximo hito</small><b>${ups[0]?(du(ups[0].date)||'¡Hoy!'):'—'}</b><span style="font-size:10px;color:var(--m)">${ups[0]?esc(ups[0].name):'sin hitos'}</span></div></div>
 <h2>Este mes</h2>${wt.map(card).join('')||'<div class="em">No hay tareas este mes</div>'}
 <h2>Próximos hitos</h2>${ups.slice(0,3).map(mcard).join('')||'<div class="em">Sin hitos próximos</div>'}`;
 // gantt
 const g=`grid-template-columns:90px repeat(${n},1fr)`;
 let h=`<div style="min-width:${90+n*30}px"><div class="gr" style="${g}"><div class="gl">Mes</div>${Array.from({length:n},(_,i)=>`<div class="gw${i+1===c?' now':''}">M${i+1}</div>`).join('')}</div>`;
 T.forEach(t=>{const p=PH(t.phase);h+=`<div class="gr" style="${g}"><div class="gl" style="color:${p.color}">${t.done?'✓ ':''}${esc(t.name.slice(0,22))}</div><div class="bar" style="grid-column:${t.weekStart+1}/${t.weekEnd+2};background:${p.color}${t.done?'44':'bb'}"></div></div>`});
 if(S.milestones.length){h+=`<div class="gr" style="${g}"><div class="gl" style="color:var(--dg)">Hitos</div>`;
  S.milestones.forEach(m=>{const w=mi(pd(m.date));if(w>=1&&w<=n)h+=`<div class="dm" style="grid-column:${w+1}">${esc(m.icon||'◆')}</div>`});h+='</div>'}
 $('v-gantt').innerHTML=T.length||S.milestones.length?`<h2>Vista Gantt</h2><div class="gs">${h}</div></div>`:'<div class="em">Aún no hay tareas.<br>Añádelas en la pestaña Tareas.</div>';
 // tasks
 const groups=[...S.phases,{id:'',name:'Sin fase',color:'#5a5f78'}];let th='';
 groups.forEach(p=>{const l=T.filter(t=>(t.phase||'')===p.id||(!p.id&&!S.phases.some(x=>x.id===t.phase)));if(!l.length)return;
  th+=`<div class="ph"><i style="background:${p.color}"></i>${esc(p.name)}<span>${l.filter(t=>t.done).length}/${l.length}</span></div>${p.obj?`<div class="to" style="margin:-4px 0 8px">🎯 ${esc(p.obj)}${p.dec?`<br>⚖️ ${esc(p.dec)}`:''}</div>`:''}${l.map(card).join('')}`});
 $('v-tasks').innerHTML=th||`<div class="em">Sin tareas todavía.<br>${S.phases.length?'Pulsa + para añadir la primera.':'Crea primero una fase en ⋯ → Nueva fase, y luego pulsa +.'}</div>`;
 $('v-hitos').innerHTML=[...S.milestones].sort((a,b)=>du(a.date)-du(b.date)).map(mcard).join('')||'<div class="em">Sin hitos.<br>Pulsa + para añadir el primero.</div>';
 const IC={nota:'📝',diseno:'🔬',riesgo:'⚠️'};
 $('v-notas').innerHTML=[['nota','Reuniones y notas'],['diseno','Diseño científico'],['riesgo','Riesgos y controles']].map(([k,l])=>`<h2>${l}</h2>`+(S.notes.filter(n=>n.kind===k).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(n=>`<div class="ms" onclick="openF('note','${n.id}')"><div style="font-size:20px">${IC[k]}</div><div style="flex:1;min-width:0"><b>${esc(n.title)}</b><small style="white-space:pre-line">${k==='nota'&&n.date?fd(n.date)+' · ':''}${esc(n.text)}</small></div></div>`).join('')||'<div class="em">Vacío</div>')).join('');
 $('tabs').innerHTML=[['home','Inicio'],['gantt','Gantt'],['tasks','Tareas'],['hitos','Hitos'],['notas','Notas']].map(([k,l])=>`<div class="tab${tab===k?' on':''}" onclick="go('${k}')">${l}</div>`).join('');
 $('nav').innerHTML=[['home','⌂','Inicio'],['gantt','▦','Gantt'],['tasks','☑','Tareas'],['hitos','◆','Hitos'],['notas','✎','Notas']].map(([k,i,l])=>`<div class="ni${tab===k?' on':''}" onclick="go('${k}')"><div>${i}</div>${l}</div>`).join('');
 ['home','gantt','tasks','hitos','notas'].forEach(k=>$('v-'+k).classList.toggle('hid',k!==tab));
 $('fab').style.display=tab==='tasks'||tab==='hitos'||tab==='notas'?'block':'none';
}

const inp=(l,i,v,t='text')=>`<label>${l}</label><input id="${i}" type="${t}" value="${esc(v)}">`;
window.openF=(type,id)=>{form={type,id};
 const T=S.tasks.find(x=>x.id===id)||{},P=S.phases.find(x=>x.id===id)||{},M=S.milestones.find(x=>x.id===id)||{},pr=S.project,N=S.notes.find(x=>x.id===id)||{};
 const wk=Math.min(Math.max(cw(),1),W());let b='',t='';
 if(type==='menu'){t='Opciones';b=`<div class="mi" onclick="openF('proj')">⚙️ Configurar proyecto</div><div class="mi" onclick="openF('phase')">➕ Nueva fase</div>${S.phases.map(p=>`<div class="mi" onclick="openF('phase','${p.id}')"><i style="background:${p.color}"></i>${esc(p.name)} <span style="margin-left:auto;color:var(--m)">✎</span></div>`).join('')}<div class="mi" style="color:var(--dg)" onclick="wipe()">🔄 Restaurar plan inicial</div><div class="ft"><button class="btn" onclick="closeF()">Cerrar</button></div>`;}
 else{
  if(type==='task'){t=id?'Editar tarea':'Nueva tarea';b=inp('Nombre','f1',T.name)+`<label>Fase</label><select id="f2"><option value="">Sin fase</option>${S.phases.map(p=>`<option value="${p.id}"${p.id===T.phase?' selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="two">${inp('Mes inicio','f3',T.weekStart||wk,'number')}${inp('Mes fin','f4',T.weekEnd||wk,'number')}</div>`+inp('Output esperado (opcional)','f5',T.output)}
  if(type==='phase'){t=id?'Editar fase':'Nueva fase';b=inp('Nombre','f1',P.name)+inp('Color','f2',P.color||'#865550','color')+inp('Objetivo','f3',P.obj)+inp('Decisión crítica','f4',P.dec)}
  if(type==='ms'){t=id?'Editar hito':'Nuevo hito';b=inp('Nombre','f1',M.name)+inp('Fecha','f2',M.date||iso(new Date()),'date')+inp('Icono (emoji)','f3',M.icon||'🎯')+inp('Resultado esperado','f4',M.res)}
  if(type==='note'){t=id?'Editar':'Nueva nota';b=`<label>Tipo</label><select id="f5">${[['nota','📝 Reunión / nota'],['diseno','🔬 Diseño científico'],['riesgo','⚠️ Riesgo']].map(([k,l])=>`<option value="${k}"${(N.kind||'nota')===k?' selected':''}>${l}</option>`).join('')}</select>`+inp('Título','f1',N.title)+`<label>Detalle</label><textarea id="f2" rows="5">${esc(N.text)}</textarea>`+inp('Fecha','f3',N.date||iso(new Date()),'date')}
  if(type==='proj'){t='Configurar proyecto';b=inp('Nombre','f1',pr.title)+inp('Fecha de inicio (Mes 1)','f2',pr.startDate,'date')+inp('Fecha de entrega','f3',pr.endDate,'date')+inp('Número de meses','f4',W(),'number')}
  b+=`<div class="ft">${id&&type!=='proj'?'<button class="btn d" onclick="delF()">Eliminar</button>':''}<button class="btn" onclick="closeF()">Cancelar</button><button class="btn p" onclick="saveF()">Guardar</button></div>`}
 $('md').innerHTML=`<h3>${t}</h3>${b}`;$('ov').classList.add('open')};
window.closeF=()=>$('ov').classList.remove('open');
const up=(arr,id,data,pre,def={})=>{if(id)Object.assign(arr.find(x=>x.id===id),data);else arr.push({id:pre+Date.now(),...def,...data})};
window.saveF=()=>{const{type,id}=form,v=k=>$(k).value.trim();
 if(type!=='proj'&&!v('f1'))return toast('⚠ Escribe un nombre');
 if(type==='task'){const ws=Math.max(1,+v('f3')||1),we=Math.max(ws,+v('f4')||ws);up(S.tasks,id,{name:v('f1'),phase:v('f2'),weekStart:ws,weekEnd:we,output:v('f5')},'t',{done:false})}
 if(type==='phase')up(S.phases,id,{name:v('f1'),color:v('f2'),obj:v('f3'),dec:v('f4')},'p');
 if(type==='ms')up(S.milestones,id,{name:v('f1'),date:v('f2'),icon:v('f3')||'◆',res:v('f4')},'m');
 if(type==='note')up(S.notes,id,{kind:v('f5'),title:v('f1'),text:$('f2').value.trim(),date:v('f3')},'n');
 if(type==='proj'){if(!v('f2')||!v('f3'))return toast('⚠ Introduce las fechas');S.project={title:v('f1')||'Doctorado PDAC',startDate:v('f2'),endDate:v('f3'),totalWeeks:Math.max(1,Math.min(60,+v('f4')||36))}}
 save();closeF();render();toast('Guardado ✓')};
window.delF=()=>{const{type,id}=form;
 if(type==='task')S.tasks=S.tasks.filter(x=>x.id!==id);
 if(type==='phase')S.phases=S.phases.filter(x=>x.id!==id);
 if(type==='ms')S.milestones=S.milestones.filter(x=>x.id!==id);
 if(type==='note')S.notes=S.notes.filter(x=>x.id!==id);
 save();closeF();render();toast('Eliminado')};
window.wipe=()=>{if(!confirm('¿Volver al plan inicial? Se perderán los cambios.'))return;S=mk();save();closeF();render()};
window.tog=id=>{const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();render();toast(t.done?'✓ Completada':'Pendiente')};
window.go=k=>{tab=k;render()};
window.addNew=()=>openF(tab==='tasks'?'task':tab==='notas'?'note':'ms');
init();setInterval(()=>{if(db)render()},60000);
</script></body></html>
